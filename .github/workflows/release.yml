name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsc-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read version and check publication prerequisites
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUCKET_KEY_CONFIGURED: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY != '' }}
        run: python scripts/release.py metadata
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Build statically linked executable
        shell: pwsh
        env:
          CARGO_TERM_COLOR: always
        run: .\scripts\build.ps1 -Target x86_64-pc-windows-msvc
      - name: Prepare executable, checksum and Scoop manifest
        shell: pwsh
        run: python scripts/release.py prepare
      - name: Store release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsc-windows-x64
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/rsc.exe
            dist/rsc.json
            dist/SHA256SUMS
            dist/LICENSE
            dist/build-info.json

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rsc-windows-x64
          path: release-assets
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
      - name: Show published release
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          echo "Release: https://github.com/yhwwwwww/rsc/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  bucket:
    name: Update Scoop bucket
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rsc-windows-x64
          path: release-assets
      - name: Check out Scoop bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yhwwwwww/scoop-bucket
          ref: main
          path: scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
      - name: Commit matching manifest to bucket
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py bucket
      - name: Show installation commands
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Install with Scoop
          ```powershell
          scoop bucket add rsc https://github.com/yhwwwwww/scoop-bucket
          scoop install rsc/rsc
          ```
          EOF
